- date: August 5, 2024
  headline: >
    Dr. Liu and Dr. Mir Jalil Razavi receive a NSF award called 
    "CDS&E/Collaborative Research: Physics-Informed Machine Learning for 
    Tailoring the Multidirectional Mechanical Properties of Composite Materials". 
    Congrats!

- date: April 12, 2022
  headline: >
    Dr. Liu receives one seed grant from Transdisciplinary Area of Excellence (TAE) 
    at Binghamton University in a collaboration with Dr. Mir Jalil Razavi. Congrats!

- date: March 28, 2022
  headline: >
    Dr. Liu's paper has been accepted for presentation at ASME IDETC/CIE2022 and 
    inclusion in the conference proceedings!

- date: March 21, 2022
  headline: >
    Dr. Liu's paper has been accepted for presentation at SME NAMRC 50 and inclusion 
    in the conference proceedings through a Special Issue of Manufacturing Letters!

- date: January 1, 2022
  headline: >
    Dr. Liu joined the Department of Mechanical Engineering at Binghamton University 
    as an Assistant Professor in January 2022!
